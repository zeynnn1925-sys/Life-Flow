    <script>
      // Gracefully handle Vite HMR in cloud preview container where HMR WebSocket port is not exposed
      (function() {
        var RealWebSocket = window.WebSocket;
        if (!RealWebSocket) return;

        function MockViteHmrWebSocket(url, protocols) {
          var emitter = new EventTarget();
          var mock = {
            url: String(url),
            readyState: 1, // OPEN
            CONNECTING: 0,
            OPEN: 1,
            CLOSING: 2,
            CLOSED: 3,
            protocol: 'vite-hmr',
            extensions: '',
            bufferedAmount: 0,
            binaryType: 'blob',
            onopen: null,
            onclose: null,
            onerror: null,
            onmessage: null,
            send: function() {},
            close: function() {
              mock.readyState = 3;
              var ev = new CloseEvent('close', { wasClean: true, code: 1000, reason: 'Closed' });
              if (mock.onclose) mock.onclose(ev);
              emitter.dispatchEvent(ev);
            },
            addEventListener: function(type, listener, options) {
              emitter.addEventListener(type, listener, options);
            },
            removeEventListener: function(type, listener, options) {
              emitter.removeEventListener(type, listener, options);
            },
            dispatchEvent: function(event) {
              return emitter.dispatchEvent(event);
            }
          };

          setTimeout(function() {
            if (mock.readyState === 1) {
              var ev = new Event('open');
              if (mock.onopen) mock.onopen(ev);
              emitter.dispatchEvent(ev);
            }
          }, 0);

          return mock;
        }

        window.WebSocket = function(url, protocols) {
          var isViteHmr = false;
          if (protocols === 'vite-hmr') isViteHmr = true;
          else if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
          else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('24678') !== -1)) isViteHmr = true;

          if (isViteHmr) {
            return MockViteHmrWebSocket(url, protocols);
          }
          return new RealWebSocket(url, protocols);
        };

        window.WebSocket.prototype = RealWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;

        // Also suppress any unhandled WebSocket rejection if triggered from outside
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) + '';
          var file = (event && (event.filename || '')) + '';
          if (msg.indexOf('WebSocket') !== -1 || file.indexOf('@vite/client') !== -1) {
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            event.preventDefault && event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event && event.reason && (event.reason.message || event.reason.stack || event.reason)) + '';
          if (reason.indexOf('WebSocket') !== -1) {
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            event.preventDefault && event.preventDefault();
          }
        }, true);
      })();
    </script>
